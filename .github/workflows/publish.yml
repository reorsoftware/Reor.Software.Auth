name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from release tag
        id: version
        shell: bash
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Reor.Software.Auth.Tests/Reor.Software.Auth.Tests.csproj

      - name: Build
        run: dotnet build Reor.Software.Auth.Tests/Reor.Software.Auth.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Reor.Software.Auth.Tests/Reor.Software.Auth.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack Reor.Software.Auth/Reor.Software.Auth.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: reor-jake

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate